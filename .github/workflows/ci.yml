name: cross-platform checks

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check index consistency
        run: python tools/sync_index_status.py --check

      - name: Run Vault Doctor
        run: python tools/vault_doctor.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: node --check Knowledge-UI/app.js

      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n open-preview.sh

      - name: Check macOS launcher syntax
        if: runner.os == 'macOS'
        run: zsh -n open-preview.command Knowledge-UI/open-preview.command Knowledge-UI/install-macos-app.command

      - name: Check executable launcher permissions
        if: runner.os != 'Windows'
        run: test -x open-preview.sh

      - name: Check macOS executable permissions
        if: runner.os == 'macOS'
        run: test -x open-preview.command && test -x Knowledge-UI/open-preview.command && test -x Knowledge-UI/install-macos-app.command

      - name: Compile and verify macOS desktop entry
        if: runner.os == 'macOS'
        run: |
          osacompile -o "$RUNNER_TEMP/Local Markdown Memory.app" Knowledge-UI/macos-launcher.applescript
          codesign --force --deep --sign - "$RUNNER_TEMP/Local Markdown Memory.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Local Markdown Memory.app"
